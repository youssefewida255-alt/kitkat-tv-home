plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kitkattv.home'
    compileSdk 34

    defaultConfig {
        applicationId 'com.kitkattv.home'
        minSdk 19
        targetSdk 34
        versionCode 2
        versionName '0.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
